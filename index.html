<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">3SVK NRIC Season 3 - Verification Portal</title>
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" id="ogTitle" content="3SVK NRIC Season 3 - Official Verified Credential">
    <meta property="og:description" id="ogDesc" content="Verify official national research and innovation challenge certificates, ranks, and achievements hosted by the 3SVK Ecosystem Platform.">
    <meta property="og:url" id="ogUrl" content="https://3svk-research.github.io/3svk-national-research-innovation-challenge-season-3-verify/">
    <meta property="og:image" id="ogImage" content="https://3svk-research.github.io/3svk-national-research-innovation-challenge-season-3-verify/assets/preview-banner.png">
    <meta property="og:type" content="website">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" id="twitterTitle" content="3SVK NRIC Season 3 - Official Verified Credential">
    <meta name="twitter:description" id="twitterDesc" content="Verify official national research and innovation challenge certificates, ranks, and achievements hosted by the 3SVK Ecosystem Platform.">
    <meta name="twitter:image" id="twitterImage" content="https://3svk-research.github.io/3svk-national-research-innovation-challenge-season-3-verify/assets/preview-banner.png">

    <style>
        body { font-family: Arial, sans-serif; background: #0b132b; color: #fff; text-align: center; padding: 40px 20px; }
        .container { max-width: 520px; margin: auto; background: #1c2541; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #3a506b; }
        h2 { color: #48cae4; margin-bottom: 5px; }
        p.subtitle { font-size: 0.9em; color: #cbd5e1; margin-bottom: 25px; }
        input { width: 80%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #48cae4; background: #0b132b; color: #fff; text-align: center; font-size: 1em; }
        button { padding: 12px 25px; background: #48cae4; border: none; border-radius: 6px; color: #0b132b; font-weight: bold; cursor: pointer; font-size: 1em; margin-top: 10px; }
        button:hover { background: #00b4d8; }
        .result { margin-top: 25px; text-align: left; background: #0b132b; padding: 20px; border-radius: 8px; display: none; border-left: 4px solid #48cae4; }
        .share-actions { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-share { padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; font-size: 0.85em; text-decoration: none; display: inline-block; text-align: center; }
        .btn-copy { background: #3a506b; color: #fff; }
        .btn-linkedin { background: #0a66c2; color: #fff; }
        .btn-whatsapp { background: #25d366; color: #fff; }
        .btn-email { background: #ea4335; color: #fff; }
        .portal-link { margin-top: 15px; display: block; color: #48cae4; font-size: 0.9em; text-decoration: none; }
        .portal-link:hover { text-decoration: underline; }
        .footer { margin-top: 30px; font-size: 0.8em; color: #64748b; }
        .footer a { color: #48cae4; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>3SVK Ecosystem Platform</h2>
    <p class="subtitle">National Research & Innovation Challenge Season 3 Credential Verification</p>
    
    <input type="text" id="certId" placeholder="Enter Certificate ID (e.g., 3SVK/NRIC/S3/001)">
    <br>
    <button onclick="verifyCertificate()">Verify Credential</button>

    <div id="resultBox" class="result"></div>
</div>

<div class="footer">
    Registered MSME: UDYAM-TS-20-0182112 | 3SVK Ecosystem Platform<br>
    <a href="https://sites.google.com/view/3svk-research-s3/home" target="_blank" rel="noopener">Visit Season 3 Official Website</a>
</div>

<script>
    const records = {
        "3SVK/NRIC/S3/001": {
            name: "Kalaiyarasu R",
            college: "SNS College of Engineering (Autonomous)",
            team: "Ignitedminds",
            rank: "Rank #1 (National Rank Holder)",
            challenge: "National Research & Innovation Challenge Season 3",
            date: "October 28, 2026",
            status: "Verified & Authentic"
        },
        "3SVK/NRIC/S3/002": {
            name: "Sayeeda Huriya Fatima",
            college: "Shadan Women's College of Engineering and Technology, Khairtabad",
            team: "metrix7",
            rank: "Rank #1 (National Rank Holder)",
            challenge: "National Research & Innovation Challenge Season 3",
            date: "October 28, 2026",
            status: "Verified & Authentic"
        },
        "3SVK/NRIC/S3/003": {
            name: "Zeeshan Ali Sheikh",
            college: "Maulana Abul Kalam Azad University of Technology (MAKAUT), West Bengal",
            team: "CodeMaker",
            rank: "Rank #1 (National Rank Holder)",
            challenge: "National Research & Innovation Challenge Season 3",
            date: "October 28, 2026",
            status: "Verified & Authentic"
        },
        "3SVK/NRIC/S3/004": {
            name: "Kantheti Yogitha",
            college: "NRI INSTITUTE OF TECHNOLOGY, AGIRPALLY",
            team: "FIR Guard",
            rank: "Rank #2 (National Rank Holder)",
            challenge: "National Research & Innovation Challenge Season 3",
            date: "October 28, 2026",
            status: "Verified & Authentic"
        },
        "3SVK/NRIC/S3/005": {
            name: "Kundeti Venkata Kishore",
            college: "NRI INSTITUTE OF TECHNOLOGY, AGIRPALLY",
            team: "FIR Guard",
            rank: "Rank #2 (National Rank Holder)",
            challenge: "National Research & Innovation Challenge Season 3",
            date: "October 28, 2026",
            status: "Verified & Authentic"
        },
        "3SVK/NRIC/S3/006": {
            name: "Arunachalam G",
            college: "K.S. Rangasamy College Of Technology (KSRCT), Namakkal",
            team: "Code Titans",
            rank: "Rank #2 (National Rank Holder)",
            challenge: "National Research & Innovation Challenge Season 3",
            date: "October 28, 2026",
            status: "Verified & Authentic"
        },
        "3SVK/NRIC/S3/007": {
            name: "Malar A",
            college: "K.S. Rangasamy College Of Technology (KSRCT), Namakkal",
            team: "Code Titans",
            rank: "Rank #2 (National Rank Holder)",
            challenge: "National Research & Innovation Challenge Season 3",
            date: "October 28, 2026",
            status: "Verified & Authentic"
        }
    };

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const queryId = urlParams.get('id');
        if (queryId) {
            document.getElementById('certId').value = queryId;
            verifyCertificate();
        }
    };

    function verifyCertificate() {
        const id = document.getElementById('certId').value.trim().toUpperCase();
        const box = document.getElementById('resultBox');
        box.style.display = 'block';

        if(!id) {
            box.innerHTML = `<h3 style="color: #ff6b6b; margin-top: 0;">⚠️ Please enter a Certificate ID</h3>`;
            return;
        }

        if(records[id]) {
            const data = records[id];
            const shareUrl = `${window.location.origin}${window.location.pathname}?id=${encodeURIComponent(id)}`;
            const shareText = `Check out my verified credential for ${data.challenge} (${data.rank}) - ${data.name} from ${data.college}: ${shareUrl}`;
            
            // Dynamically update page titles and Open Graph meta tags for social crawlers
            document.getElementById('pageTitle').innerText = `${data.name} - ${data.rank} | 3SVK Verification`;
            
            const ogTitleText = `${data.name} - ${data.rank} (${data.challenge})`;
            const ogDescText = `Institution: ${data.college} | Team: ${data.team} | Status: ${data.status} | Verified by 3SVK Ecosystem Platform (MSME: UDYAM-TS-20-0182112)`;

            document.getElementById('ogTitle').setAttribute('content', ogTitleText);
            document.getElementById('ogDesc').setAttribute('content', ogDescText);
            document.getElementById('ogUrl').setAttribute('content', shareUrl);

            document.getElementById('twitterTitle').setAttribute('content', ogTitleText);
            document.getElementById('twitterDesc').setAttribute('content', ogDescText);

            const linkedinUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl)}`;
            const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
            const emailUrl = `mailto:?subject=${encodeURIComponent("My 3SVK NRIC Season 3 Verified Credential - " + data.name)}&body=${encodeURIComponent("Hello,\n\nYou can view my verified certificate and achievement details here:\n\n" + shareUrl)}`;

            box.innerHTML = `
                <h3 style="color: #48cae4; margin-top: 0;">✅ Status: ${data.status}</h3>
                <p><b>Certificate ID:</b> ${id}</p>
                <p><b>Participant Name:</b> ${data.name}</p>
                <p><b>Institution:</b> ${data.college}</p>
                <p><b>Team Name:</b> ${data.team}</p>
                <p><b>Achievement:</b> ${data.rank}</p>
                <p><b>Event:</b> ${data.challenge}</p>
                <p><b>Issue Date:</b> ${data.date}</p>
                
                <a class="portal-link" href="https://sites.google.com/view/3svk-research-s3/home" target="_blank" rel="noopener">🌐 Visit Season 3 Official Website</a>

                <div class="share-actions">
                    <button class="btn-share btn-copy" onclick="copyLink('${shareUrl}')">📋 Copy Link</button>
                    <a class="btn-share btn-linkedin" href="${linkedinUrl}" target="_blank" rel="noopener">LinkedIn</a>
                    <a class="btn-share btn-whatsapp" href="${whatsappUrl}" target="_blank" rel="noopener">WhatsApp</a>
                    <a class="btn-share btn-email" href="${emailUrl}">Email</a>
                </div>
            `;
        } else {
            box.innerHTML = `<h3 style="color: #ff6b6b; margin-top: 0;">❌ Credential Not Found</h3>
                             <p>No records match the ID entered. Please check the Certificate ID and try again.</p>`;
        }
    }

    function copyLink(url) {
        navigator.clipboard.writeText(url).then(() => {
            alert("Verification link copied to clipboard!");
        });
    }
</script>

</body>
</html>
